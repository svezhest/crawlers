[project]
name = "tiktok-crawler"
version = "0.1.0"
description = "Download a TikTok profile's posts (metadata, comments with replies, photo-post images) to JSONL"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "requests[socks]>=2.31", "playwright>=1.45"]

[project.scripts]
crawl-tiktok = "tiktok_crawler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiktok_crawler"]
