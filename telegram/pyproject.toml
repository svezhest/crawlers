[project]
name = "telegram-crawler"
version = "0.1.0"
description = "Download Telegram chats/channels (with comment threads, polls, media metadata) to JSONL via Telethon"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "pysocks>=1.7",
    "python-socks>=2.4",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.scripts]
crawl-telegram = "telegram_crawler.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telegram_crawler"]
